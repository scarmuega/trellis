# <trellis runtime binding> Plan dispatch: on a cadence, scan plans/ for the ones
# an owner has released for a taker (`status: ready`) and start an `act` session
# per plan to advance it. The scan is deterministic (no judgment); each plan's
# work runs as a separate `/trellis:act <owner>` under that owner's authority —
# an agent-held owner advances it autonomously, a human-held owner receives it as
# a handoff. The taker flips `ready → active` as it claims the work, so a plan
# leaves the queue the moment work starts (idempotent across runs). A plan whose
# `awaits:` targets are not all retired is held — skipped, still ready, retried
# next tick. Keep the cron in step with the `plan dispatch` row in rituals.md. Requires ANTHROPIC_API_KEY
# in the forge's secrets. See spec companion: runtime.md ("Plan dispatch").
name: trellis plan dispatch

on:
  schedule:
    - cron: "0 9 * * *" # daily, 09:00 UTC — match the plan dispatch row in rituals.md
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the trellis plugin
        uses: actions/checkout@v4
        with:
          repository: scarmuega/trellis
          # ref: <pin the plugin SHA your domain operates against>
          path: .trellis/plugin

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Advance every ready plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for plan in plans/*.md; do
            # read status and owner from the frontmatter block only (before the 2nd ---)
            status=$(awk '/^---[[:space:]]*$/{n++; next} n>=2{exit} /^status:/{print $2; exit}' "$plan")
            [ "$status" = "ready" ] || continue
            # <trellis runtime binding> Declared sequencing. A ready plan that
            # awaits other plans dispatches only once every target is retired —
            # retirement is the owner's verdict, so unlocking a dependent is an
            # owner act, never an inference from a PR or a report. The hold is
            # not `blocked`: the plan stays ready and self-clears next tick.
            # Both reads are declared fields (the scan stays deterministic); a
            # target that does not resolve holds the plan, fail closed —
            # conventions-lint item 4 owns the repair.
            awaits=$(awk '
              /^---[[:space:]]*$/ { n++; next } n>=2 { exit }
              /^awaits:[[:space:]]*\[/ { s=$0; sub(/^awaits:[[:space:]]*\[/, "", s); sub(/\].*/, "", s); gsub(/,/, " ", s); print s; exit }
              /^awaits:[[:space:]]*$/ { in_list=1; next }
              in_list && /^[[:space:]]+-[[:space:]]*/ { sub(/^[[:space:]]+-[[:space:]]*/, ""); print; next }
              in_list { exit }' "$plan")
            held=""
            for target in $awaits; do
              if [ ! -f "$target" ]; then
                echo "::warning::$plan awaits '$target', which does not resolve — holding it in the queue (conventions-lint item 4)"
                held=1; break
              fi
              target_status=$(awk '/^---[[:space:]]*$/{n++; next} n>=2{exit} /^status:/{print $2; exit}' "$target")
              if [ "$target_status" != "retired" ]; then
                echo "Holding $plan — awaits $target (status: ${target_status:-none}); it stays ready and re-enters the scan next tick"
                held=1; break
              fi
            done
            [ -n "$held" ] && continue
            owner=$(awk '/^---[[:space:]]*$/{n++; next} n>=2{exit} /^owner:/{print $2; exit}' "$plan")
            if [ -z "$owner" ]; then
              echo "::warning::$plan is ready but declares no owner — skipping"
              continue
            fi
            # <trellis runtime binding> Complexity → session resources. The spec
            # defines the tiers (reasoning depth, not size); this mapping is where
            # the binding turns them into reasoning effort, a model, and a budget
            # — retune it here, never in a plan. Every branch names its model and
            # effort explicitly, including the absent one: an omitted --model
            # silently inherits whoever's `model` setting the runner happens to
            # carry, which would make the same plan dispatch differently per
            # runner and break this root's reproducibility guarantee.
            complexity=$(awk '/^---[[:space:]]*$/{n++; next} n>=2{exit} /^complexity:/{print $2; exit}' "$plan")
            case "$complexity" in
              mechanical) session=(--model opus  --effort high);  budget=5 ;;
              standard)   session=(--model opus  --effort xhigh); budget=10 ;;
              deep)       session=(--model fable --effort xhigh); budget=25 ;;
              # Absent = the standard session. `standard` is the unmarked case —
              # the plan fixes outcomes and the taker exercises local judgment —
              # so both other tiers are deliberate departures from it: mechanical
              # claims the plan fully determines the change, deep claims novel
              # cross-context judgment. An unscoped plan is the ordinary one.
              *)          session=(--model opus  --effort xhigh); budget=10
                          [ -z "$complexity" ] || echo "::warning::$plan declares complexity '$complexity', which is not a legal tier — dispatching with the standard session (conventions-lint item 4)" ;;
            esac
            echo "Dispatching $plan to ${owner#org/} (complexity: ${complexity:-unspecified})"
            claude -p "/trellis:act ${owner#org/} advance $plan toward its objective: make the next increment of progress within your authority; flip its status ready→active as you claim it, blocked if you hit an uncleared blocker; leave a trail." \
              --plugin-dir "$PWD/.trellis/plugin" \
              --permission-mode auto \
              "${session[@]}" \
              --max-budget-usd "$budget"
            # No --allowedTools: the session gets the same tool surface an
            # interactive one has, so a role that writes code can run the build
            # and test commands of the contexts it implements and actually verify
            # its own work — an allowlist that omits them leaves every PR draft by
            # construction. `auto` approves the routine calls that would otherwise
            # block a headless run. What bounds the agent is not the flag list: the
            # role's mandate authority, the effective automation class (a core
            # change is never landed, only proposed), the plugin's PreToolUse gate
            # on provenance and append-only decisions, and branch protection on the
            # PR it opens. Budget, model, and effort are tuned in the mapping above.
          done

      - name: Commit changes made within authority
        run: |
          rm -rf .trellis
          git config user.name "trellis-runtime"
          git config user.email "trellis-runtime@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || {
            git commit -m "chore(dispatch): advance ready plans"
            git push
          }
