# <trellis runtime binding> [FORGE CLOCK] If this domain runs `trellis serve`,
# this workflow is the redundant clock — delete it. A domain runs one clock,
# never two (decision 0038).
#
# Plan dispatch: on a cadence, scan plans/ for the ones
# an owner has released for a taker (`status: ready`) and start an `act` session
# per plan to advance it. The scan is deterministic (no judgment); each plan's
# work runs as a separate `/trellis:act <owner>` under that owner's authority —
# an agent-held owner advances it autonomously, a human-held owner receives it as
# a handoff. The taker flips `ready → active` as it claims the work, so a plan
# leaves the queue the moment work starts (idempotent across runs). A plan whose
# `awaits:` targets are not all retired is held — skipped, still ready, retried
# next tick. Keep the cron in step with the `plan dispatch` row in rituals.md. Requires ANTHROPIC_API_KEY
# in the forge's secrets. See spec companion: runtime.md ("Plan dispatch").
#
# The scan itself is the trellis kernel (`trellis dispatch scan`, decision 0037):
# frontmatter reads, the awaits hold (fail closed on an unresolvable target), and
# the ownerless-plan skip all live in the binary, tested against fixtures.
name: trellis plan dispatch

on:
  schedule:
    - cron: "0 9 * * *" # daily, 09:00 UTC — match the plan dispatch row in rituals.md
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the trellis plugin
        uses: actions/checkout@v4
        with:
          repository: scarmuega/trellis
          # ref: <pin the plugin SHA your domain operates against>
          path: .trellis/plugin

      - name: Install the trellis kernel
        # Compiled from the plugin checkout while distribution is deferred
        # (decision 0037); swap for a release-artifact download when releases
        # exist. The runner image ships a Rust toolchain.
        run: cargo install --path .trellis/plugin/cli --root "$HOME/.trellis-kernel" --locked

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Advance every ready plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$HOME/.trellis-kernel/bin:$PATH"
          # <trellis runtime binding> Complexity → session resources. The spec
          # defines the tiers (reasoning depth, not size); these --map flags are
          # where the binding turns them into reasoning effort, a model, and a
          # budget — retune them here, never in a plan. All three tiers are
          # passed explicitly so provider names, effort levels, and prices live
          # only in this workflow (decision 0032); the kernel's compiled-in
          # defaults never decide a session. Absent complexity = standard —
          # the unmarked case: mechanical claims the plan fully determines the
          # change, deep claims novel cross-context judgment. An illegal tier
          # dispatches as standard with a warning (conventions-lint item 4).
          trellis dispatch scan --format json \
            --map "mechanical=opus:high:5" \
            --map "standard=opus:xhigh:10" \
            --map "deep=fable:xhigh:25" \
            > /tmp/dispatch.json

          jq -r '.warnings[]' /tmp/dispatch.json | while IFS= read -r w; do
            echo "::warning::$w"
          done
          jq -r '.held[] | "Holding \(.plan) — awaits \(.awaits) (status: \(.target_status // "missing")); it stays ready and re-enters the scan next tick"' /tmp/dispatch.json

          jq -c '.dispatch[]' /tmp/dispatch.json | while IFS= read -r item; do
            plan=$(jq -r '.plan' <<<"$item")
            owner=$(jq -r '.owner_short' <<<"$item")
            model=$(jq -r '.model' <<<"$item")
            effort=$(jq -r '.effort' <<<"$item")
            budget=$(jq -r '.budget_usd' <<<"$item")
            complexity=$(jq -r '.complexity' <<<"$item")
            echo "Dispatching $plan to $owner (complexity: $complexity)"
            claude -p "/trellis:act $owner advance $plan toward its objective: make the next increment of progress within your authority; flip its status ready→active as you claim it, blocked if you hit an uncleared blocker; leave a trail." \
              --plugin-dir "$PWD/.trellis/plugin" \
              --permission-mode auto \
              --model "$model" \
              --effort "$effort" \
              --max-budget-usd "$budget"
            # No --allowedTools: the session gets the same tool surface an
            # interactive one has, so a role that writes code can run the build
            # and test commands of the contexts it implements and actually verify
            # its own work — an allowlist that omits them leaves every PR draft by
            # construction. `auto` approves the routine calls that would otherwise
            # block a headless run. What bounds the agent is not the flag list: the
            # role's mandate authority, the effective automation class (a core
            # change is never landed, only proposed), the plugin's PreToolUse gate
            # on provenance and append-only decisions, and branch protection on the
            # PR it opens. Budget, model, and effort are tuned in the --map flags above.
          done

      - name: Commit changes made within authority
        run: |
          rm -rf .trellis
          git config user.name "trellis-runtime"
          git config user.email "trellis-runtime@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || {
            git commit -m "chore(dispatch): advance ready plans"
            git push
          }
