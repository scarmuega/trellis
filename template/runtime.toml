# <trellis runtime binding> Runtime config for `trellis serve` — the clock,
# the harness, and the serving surface for this domain (decisions 0038, 0039).
# The daemon is the domain's only clock: run it wherever this repository is
# checked out, under whatever supervises long-running processes there
# (launchd, systemd, a terminal).
#
# Secrets never live here. The daemon's own environment carries them
# (ANTHROPIC_API_KEY and anything else the harness needs) and every spawned
# session inherits it. Lint item 10 sweeps this file for credentials.
#
# Every field below is a default made explicit. An absent runtime.toml is
# legal and means exactly what is written here.

[server]
# Loopback is deliberate: the API and board carry no authentication, so
# binding anything else publishes a read of the whole domain.
bind = "127.0.0.1"
port = 7357

[scheduler]
# Seconds between passes. A pass is cheap — it reads the tree and compares
# dates — so this is latency, not load.
tick_secs = 60
# Sessions that may run at once. A task that finds no slot stays due and
# starts on the next pass; nothing is dropped.
max_concurrent = 2
# "once": a cadence missed while the machine slept fires once on waking.
# "skip": the missed window is recorded and never run, so the next fire lands
# a full period out. Either way, never once per missed window.
catchup = "once"
# Overrides the `plan dispatch` row's cadence in rituals.md.
# dispatch_cadence = "daily"

[harness]
# Who carries a running session (decision 0043). "process" — the daemon
# spawns headless one-shot children itself: exit codes, budget caps, logs.
# "herdr" — sessions run as interactive agents in herdr panes: attachable,
# visible in the sidebar, alive across a daemon restart, and *budget-uncapped*
# (--max-budget-usd only works with --print). Requires a running herdr
# server; refused at startup if unreachable. See [harness.herdr] below.
backend = "process"

# argv arrays, never shell strings: a placeholder fills exactly one argument,
# so nothing an artifact carries can become a shell word. Placeholders:
# {prompt} {model} {effort} {budget} {plugin_dir} {root} {plan} {owner}
# {ritual} {complexity} {mcp} {escalate_to}. A second harness (pi, Codex,
# OpenCode) is these two lines rewritten — Claude Code is the reference
# adapter, not a hardcode.
#
# {mcp} is the session's back-channel: the daemon serves MCP on its own socket,
# and a session handed the endpoint can ask a question and wait for an answer
# rather than blocking its plan for a cadence, and report progress you can watch
# without opening a log (decision 0041). Answer with `trellis inbox`, or on the
# board. Every harness speaks MCP natively, so this costs no adapter — and a
# harness that does not can drop the two arguments and lose nothing else. Under
# --no-http there is no socket to call back on, so {mcp} renders empty and the
# daemon says so once at startup.
#
# No --plugin-dir below: the daemon runs where the plugin is installed in the
# harness, which is the premise of operating locally. Against a checkout that
# is not installed, add "--plugin-dir", "{plugin_dir}" and supply it with
# --plugin-root or CLAUDE_PLUGIN_ROOT — naming {plugin_dir} without either is
# refused at startup rather than pointing a session at the wrong plugin.
#
# No --allowedTools on the act session: an allowlist that omits Bash leaves
# every PR draft by construction, and what actually bounds the session is the
# role's mandate, the artifact's automation class, the provenance gate, and the
# approval gate — never a flag list.
act_cmd = [
  "claude", "-p", "{prompt}",
  "--permission-mode", "auto",
  "--model", "{model}",
  "--effort", "{effort}",
  "--max-budget-usd", "{budget}",
  "--mcp-config", "{mcp}",
]
ritual_cmd = [
  "claude", "-p", "{prompt}",
  "--permission-mode", "acceptEdits",
  "--allowedTools", "Read", "Grep", "Glob", "Write", "Edit", "Bash(gh *)", "Bash(git *)",
  "--max-budget-usd", "5",
  "--mcp-config", "{mcp}",
]

# The herdr backend's own knobs; ignored under backend = "process". Agent
# *flags*, not a full command: herdr owns the executable (kind), and the
# prompt is submitted to the running TUI — so no {prompt} here, and no
# {budget}, which is refused rather than silently unenforced.
[harness.herdr]
kind = "claude"
# socket = "~/.config/herdr/herdr.sock"   # herdr's default; HERDR_SOCKET_PATH wins
act_args = [
  "--permission-mode", "auto",
  "--model", "{model}",
  "--effort", "{effort}",
  "--mcp-config", "{mcp}",
]
ritual_args = [
  "--permission-mode", "acceptEdits",
  "--mcp-config", "{mcp}",
]
# What a finished session's workspace does: "on-failure" keeps only the
# blocked and lost ones on screen for attach; "always" | "never".
retain = "on-failure"
# What daemon shutdown does to running sessions: "detach" leaves them in
# herdr and the next daemon adopts them; "stop" closes their workspaces.
on_shutdown = "detach"

[prompts]
act = "/trellis:act {owner} advance {plan} toward its objective: make the next increment of progress within your authority. Dispatched: the runtime has pre-verified the mechanical readiness items and this plan's holds, and the acting-role marker is already stamped — evaluate only the judgment items. Claim with `trellis plan claim {plan}`; on an uncleared blocker `trellis plan block {plan} --by {owner} --asks …` (escalations go to {escalate_to}); write escalation records with `trellis escalate add`; leave a trail."
ritual = "/trellis:ritual {ritual}"

# Complexity → session resources. The spec defines the tiers (reasoning depth,
# never size); this is where this binding turns them into a model, an effort
# level, and a budget. Retune here, never in a plan (decision 0032). Absent
# complexity means standard; an illegal tier dispatches as standard with a
# warning (conventions-lint item 4). `trellis serve --map` overrides a tier for
# one run without editing this file.
[sessions]
mechanical = "opus:medium:5"
standard = "opus:high:10"
deep = "fable:xhigh:25"

# Push transports for newly opened escalation records — and for questions
# sessions park on the ask channel, one tick late at worst. One adapter ships
# (decision 0043): "herdr" turns a record that newly reads `open` into a
# toast in the operator's herdr session, sessions' blocked states included.
# The record in the tree stays the system of record; a herdr that is down
# mid-run is a logged failure, never a stopped clock — but one that is
# configured and unreachable at startup is refused. Any other kind is still
# refused outright; records are always readable from the board,
# /api/escalations, or the root itself.
# [[channels]]
# kind = "herdr"
# socket = "~/.config/herdr/herdr.sock"   # optional; herdr's default otherwise
