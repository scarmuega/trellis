# <trellis runtime binding> Runtime config for the three runtime processes
# (decisions 0038, 0039, 0046): `trellis dispatch run` — the continuous pull
# loop that spawns act sessions the moment plans become dispatchable;
# `trellis rituals` — one idempotent pass of the wall-clock work, invoked by
# cron, launchd, or a hand, as often as you like; `trellis serve` — the
# read-only board and API, no clock, safe to not run. Run the dispatcher
# wherever this repository is checked out, under whatever supervises
# long-running processes there; give rituals to the OS scheduler.
#
# Secrets never live here. The daemon's own environment carries them
# (ANTHROPIC_API_KEY and anything else the harness needs) and every spawned
# session inherits it. Lint item 10 sweeps this file for credentials.
#
# Every field below is a default made explicit. An absent runtime.toml is
# legal and means exactly what is written here.

[server]
# Loopback is deliberate: the API and board carry no authentication, so
# binding anything else publishes a read of the whole domain.
bind = "127.0.0.1"
port = 7357

[scheduler]
# Seconds between the dispatcher's passes. A pass is cheap — it reads the
# tree — so this is reaction latency, not load. There is no dispatch cadence
# (decision 0046): the loop reacts to the tree, and an `awaits:` release
# dispatches within one tick, not one day.
tick_secs = 60
# Sessions one process may run at once — dispatch and rituals each get their
# own allowance, so a ritual batch cannot starve dispatch. A task that finds
# no slot stays due and starts as slots free; nothing is dropped.
max_concurrent = 2
# Seconds a plan is skipped after a session ended without claiming it — the
# tight loop's crash-loop backstop. Claims and blocks clear it naturally.
retry_cooldown_secs = 900
# Rituals only. "once": a window missed while nothing was running fires once
# on the next `trellis rituals` invocation. "skip": the missed window is
# recorded and never run, so the next fire lands a full period out. Either
# way, never once per missed window.
catchup = "once"

[harness]
# Sessions run as interactive agents in herdr panes (decisions 0043, 0061):
# attachable, visible in the sidebar, and alive across a daemon restart.
# Requires a running herdr server; refused at startup if unreachable —
# configured-and-dead is wrong, not degraded.
#
# There is no second backend. The daemon used to spawn headless children
# itself and read completion from their exit codes; it now reads completion
# from the plan on disk, which is where the truth always was (decision 0061).
# One consequence is priced in at the door: --max-budget-usd only works with
# --print, so an interactive session is *budget-uncapped* and naming a budget
# below is refused rather than silently unenforced.
#
# Agent *flags*, never a full command and never a shell string: herdr owns the
# executable (kind), and the prompt is submitted to the running TUI rather
# than carried in argv — so no {prompt} here, and nothing an artifact carries
# can become a shell word. Placeholders:
# {model} {effort} {budget} {plugin_dir} {root} {plan} {owner}
# {ritual} {complexity} {mcp} {escalate_to} {automation} {instruction}
# {delegation} {procedure} {executor} {skills} {mandate} {holder}. A second
# agent kind is `kind` rewritten — Claude Code is the reference adapter, not a
# hardcode, and since the default prompts are self-contained (decision 0050)
# it needs no plugin dialect of its own.
#
# {mcp} is the session's back-channel: the daemon serves MCP on its own socket,
# and a session handed the endpoint can ask a question and wait for an answer
# rather than blocking its plan for a cadence, and report progress you can watch
# without opening a log (decision 0041). Answer with `trellis inbox`, or on the
# board. Every harness speaks MCP natively, so this costs no adapter — and a
# harness that does not can drop the two arguments and lose nothing else. The
# channel lives with the process that spawned the session (dispatch or
# rituals — decision 0046); only --dry-run runs without one.
#
# {skills} is the session's rendered skill index (decision 0055): a plan
# session gets the owner's holder skills plus each contexts: home's, a
# ritual its executor's — names and paths, never bodies; the session reads a
# listed file through its own tools when the work calls for it. The value is
# self-contained (heading and instruction included) and the empty string
# when no skill exists, so naming it costs nothing. Skill availability in a
# spawned session is this index, not the harness's own inventory — an
# instance that also wants Claude Code's installed-skill noise suppressed
# can add "--setting-sources", "" and "--settings",
# '{"disableBundledSkills":true}' to act_args, at the price of every
# settings-borne hook.
#
# {mandate} and {holder} are the acting role's mandate.md and (when the
# holder is a local package) holder/system.md, rendered whole into the
# prompt (decision 0058) — the reads the act procedure's resolve-the-mandate
# and adopt-the-holder steps ask for, already done at spawn. Both values are
# self-contained and the empty string when there is nothing to render, so
# naming them costs nothing; a ref holder still adopts inline per the
# procedure.
#
# No --plugin-dir below: the default prompts render the act procedure into
# the prompt itself (decision 0050), so a spawned session needs no installed
# plugin. --plugin-dir remains how sessions reach an uninstalled checkout's
# hooks and the interactive plane's invocable skills — a spawned session's
# skills arrive as the {skills} index instead (decision 0055): add
# "--plugin-dir", "{plugin_dir}" and supply it with
# --plugin-root or CLAUDE_PLUGIN_ROOT — naming {plugin_dir} without either is
# refused at startup rather than pointing a session at the wrong plugin.
# --plugin-root / CLAUDE_PLUGIN_ROOT also swap the {procedure} source from
# the binary's embedded copy to the live checkout's commands/.
#
# No --allowedTools on the act session: an allowlist that omits Bash leaves
# every PR draft by construction, and what actually bounds the session is the
# role's mandate, the artifact's automation class, the provenance gate, and the
# approval gate — never a flag list.

[harness.herdr]
kind = "claude"
# socket = "~/.config/herdr/herdr.sock"   # herdr's default; HERDR_SOCKET_PATH wins
act_args = [
  "--permission-mode", "auto",
  "--model", "{model}",
  "--effort", "{effort}",
  "--mcp-config", "{mcp}",
]
ritual_args = [
  "--permission-mode", "acceptEdits",
  "--mcp-config", "{mcp}",
]
# What a retired session's workspace does: "on-failure" keeps the scene of an
# unaccounted end — recycled, or lost with its pane — on screen for attach,
# and closes the ones whose plan says what happened; "always" | "never".
retain = "on-failure"
# What daemon shutdown does to running sessions: "detach" leaves them in
# herdr and the next daemon adopts them; "stop" closes their workspaces.
on_shutdown = "detach"
# Seconds a settled session is granted before the runtime concludes its plan
# was abandoned, hands it back to ready, and closes the pane (decision 0061).
# This bounds a *stall*, never work: a session with something to say says it
# in the plan — a verdict, or a `handoff:` for work that outlives the turn —
# and either answer retires the pane at once, whatever this is set to. Below
# 60s the daemon notes that a slow turn boundary could read as a stall.
idle_grace_secs = 120

# The trigger table (decisions 0051, 0060): the two prompts the runtime fires
# on its own, name → template. "act" is what the dispatch loop fires per
# dispatchable plan, "ritual" what the cadence pass fires per due row. Both
# ship as defaults, shown below verbatim; override either and you own the
# variant. The only procedure the binary carries is act — {procedure} always
# renders commands/act.md (embedded, or the --plugin-root checkout's copy),
# so no installed plugin is required, and each template is self-contained
# (decision 0050).
#
# There is no errand entry here, and adding one buys nothing: an errand is an
# ask written at the moment it is wanted (decision 0060), so it has no name
# to declare and its framing is framework-authored. Ask for one with
# `trellis dispatch request <plan> "<instruction>" [--model M] [--effort E]`,
# or the board's Errand menu.
#
# The first line of every template names what the session is for, which is
# what an operator sees at the top of the pane when they attach. An instance
# that prefers the installed-plugin spelling sets a one-liner back — e.g.
# act = "/trellis:act {owner} advance {plan} …" — and everything renders as
# before; the daemon always supplies every placeholder and the template
# chooses which to name.
[prompts]
act = """{plan} — dispatched act as {owner} (trellis runtime).

Act as {owner}: advance {plan} toward its objective — make the next increment of progress within your authority. The runtime has pre-verified the mechanical readiness items and this plan's holds, the acting-role marker is already stamped (leave it alone), the plan is already claimed for you — it went ready → active as this session started, so never claim it again — and the change mechanics are computed: {automation}; core never lands, it is proposed. Evaluate only the judgment items. Your mandate and any local holder package are rendered below, so the procedure's read-the-mandate and adopt-the-holder steps are already done — a holder ref naming a plugin agent still adopts inline per the procedure. On an uncleared blocker `trellis plan block {plan} --by {owner} --asks …` (escalations go to {escalate_to}); write escalation records with `trellis escalate add`; leave a trail. End with a verdict, spelled as a command: retire it (`trellis plan retire {plan}`); block it (`trellis plan block {plan} --by {owner} --asks …`); where your mandate names a hand-off, pass it to the mandated next taker (`trellis plan pass {plan} --to <role>` — the mandate's spelling wins for the role); or — if you leave a proposal for its owner to rule on and no hand-off is mandated — park it on that proposal (`trellis plan handoff {plan} <pr>`). The runtime reads completion from the plan itself, not from your session: a plan left active with no handoff is returned to ready once you go idle, and dispatched again. That includes work you park in the background — a long build, a monitor, anything that outlives the turn: declare it with `trellis plan handoff` or it is lost with the session.

{mandate}

{holder}

{skills}

The procedure below is the trellis framework's commands/act.md, rendered into this prompt so no installed plugin is required; the domain root's trellis.toml and domain.md are authoritative over it where they differ.

{procedure}"""

ritual = """ritual {ritual} — executed by {executor} (trellis runtime).

Execute the ritual "{ritual}" from rituals.md as {executor}: read its row and take the procedure (a skill ref or inline steps) and the cadence — the freshness window for any metrics involved. The runtime resolved the executor and stamped the acting-role marker (leave it alone); escalations go to {escalate_to}. The executor's mandate and any local holder package are rendered below, so the procedure's read-the-mandate and adopt-the-holder steps are already done. Deliver findings through the instance's escalation channel; an executor that owns no artifact reports each finding verbatim, addressed to the owner who transcribes it.

{mandate}

{holder}

{skills}

The procedure below is the trellis framework's commands/act.md, rendered into this prompt so no installed plugin is required; the domain root's trellis.toml and domain.md are authoritative over it where they differ.

{procedure}"""

# Complexity → session resources. The spec defines the tiers (reasoning depth,
# never size); this is where this binding turns them into a model, an effort
# level, and a budget. Retune here, never in a plan (decision 0032). Absent
# complexity means standard; an illegal tier dispatches as standard with a
# warning (conventions-lint item 4). `trellis dispatch run --map` overrides a
# tier for one run without editing this file.
[sessions]
mechanical = "opus:medium:5"
standard = "opus:high:10"
deep = "fable:xhigh:25"

# Push transports for newly opened escalation records — and for questions
# sessions park on the ask channel, one tick late at worst. One adapter ships
# (decision 0043): "herdr" turns a record that newly reads `open` into a
# toast in the operator's herdr session, sessions' blocked states included.
# The record in the tree stays the system of record; a herdr that is down
# mid-run is a logged failure, never a stopped clock — but one that is
# configured and unreachable at startup is refused. Any other kind is still
# refused outright; records are always readable from the board,
# /api/escalations, or the root itself.
# [[channels]]
# kind = "herdr"
# socket = "~/.config/herdr/herdr.sock"   # optional; herdr's default otherwise
