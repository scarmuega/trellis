<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trellis board</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8; --panel: #fff; --ink: #1d1c1a; --muted: #6b6862;
    --line: #e2ded7; --accent: #7a5c2e; --warn: #9c3b28; --hold: #7a6a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16151a; --panel: #1e1d23; --ink: #eceaf2; --muted: #9d99a8;
      --line: #2f2d36; --accent: #cfa763; --warn: #e08a76; --hold: #cbbb72;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
    padding: 1rem 1.25rem; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 1rem; margin: 0; font-weight: 650; letter-spacing: .01em; }
  header .meta { color: var(--muted); font-size: .8rem; }
  header .meta code { font-size: .78rem; }
  main { display: flex; gap: .75rem; padding: 1rem 1.25rem; align-items: flex-start; overflow-x: auto; }
  .column { flex: 1 0 15rem; min-width: 15rem; }
  .column > h2 {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 .5rem .15rem; font-weight: 650;
  }
  .column > h2 .count { color: var(--ink); opacity: .55; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: .6rem .7rem; margin-bottom: .5rem;
  }
  .card .name { font-weight: 600; overflow-wrap: anywhere; }
  .card .owner { color: var(--muted); font-size: .8rem; margin-top: .1rem; }
  .badges { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .45rem; }
  .badge {
    font-size: .68rem; padding: .1rem .4rem; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .badge.dwell { border-color: transparent; background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .badge.escalation { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .badge.held { color: var(--hold); border-color: color-mix(in srgb, var(--hold) 45%, transparent); }
  .badge.complexity { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .empty { color: var(--muted); font-size: .8rem; font-style: italic; padding: .2rem .15rem; }
  .badge.asking { color: var(--warn); border-color: var(--warn); font-weight: 650; }
  /* The sessions strip. Every in-flight session appears here, including the
     ritual and dispatch ones that have no plan card — which is why answering
     lives on this surface and not on the cards. */
  .sessions { padding: 0 1.25rem 1rem; }
  .sessions > h2 {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 .5rem .15rem; font-weight: 650;
  }
  .session {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: .6rem .7rem; margin-bottom: .5rem;
  }
  .session.waiting { border-color: var(--warn); }
  .session .label { font-weight: 600; overflow-wrap: anywhere; }
  .progress {
    margin: .45rem 0 0; padding: 0; list-style: none;
    color: var(--muted); font-size: .8rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .progress li { overflow-wrap: anywhere; }
  .progress li .at { opacity: .6; margin-right: .5rem; }
  .ask { margin-top: .55rem; border-top: 1px solid var(--line); padding-top: .55rem; }
  .ask .q { color: var(--warn); font-weight: 600; overflow-wrap: anywhere; }
  .ask .ctx { color: var(--muted); font-size: .8rem; margin-top: .1rem; }
  .ask .choices { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .5rem; }
  .ask button {
    font: inherit; font-size: .8rem; padding: .25rem .6rem; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
  }
  .ask button:hover { border-color: var(--accent); color: var(--accent); }
  .ask form { display: flex; gap: .35rem; margin-top: .5rem; }
  .ask input {
    flex: 1; font: inherit; font-size: .8rem; padding: .25rem .5rem;
    border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink);
  }
  footer {
    padding: .7rem 1.25rem; border-top: 1px solid var(--line);
    color: var(--muted); font-size: .78rem;
    display: flex; gap: 1rem; flex-wrap: wrap;
  }
  .problem { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>Trellis board</h1>
  <span class="meta" id="root"></span>
  <span class="meta" id="clock"></span>
</header>
<main id="board"></main>
<section class="sessions" id="sessions"></section>
<footer>
  <span id="daemon"></span>
  <span id="notes"></span>
</footer>

<script>
const $ = (id) => document.getElementById(id);

// A hold is a property of a ready plan, not a column: it is shown on the
// card so the board never implies a status the model does not have.
function card(plan) {
  const el = document.createElement("article");
  el.className = "card";

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = plan.plan.replace(/^plans\//, "").replace(/\.md$/, "");
  el.append(name);

  const owner = document.createElement("div");
  owner.className = "owner";
  owner.textContent = plan.owner || "no owner";
  el.append(owner);

  const badges = document.createElement("div");
  badges.className = "badges";
  const add = (text, cls) => {
    const b = document.createElement("span");
    b.className = "badge" + (cls ? " " + cls : "");
    b.textContent = text;
    badges.append(b);
  };
  if (plan.type) add(plan.type);
  if (plan.complexity) add(plan.complexity, "complexity");
  if (plan.dwell_days !== null && plan.dwell_days !== undefined) add(plan.dwell_days + "d", "dwell");
  if (plan.held) add("held — awaits " + plan.held.replace(/^plans\//, ""), "held");
  if (plan.open_escalations > 0) {
    add(plan.open_escalations + (plan.open_escalations === 1 ? " escalation" : " escalations"), "escalation");
  }
  if (asking.has("plan:" + plan.plan)) add("waiting on you", "asking");
  if (badges.children.length) el.append(badges);
  return el;
}

// Task keys with a question outstanding, so a plan card can say so. Set by
// refresh() before the columns are built.
let asking = new Set();

async function answer(ticket, choice) {
  if (!choice) return;
  await fetch("/api/sessions/" + encodeURIComponent(ticket) + "/answer", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ answer: choice }),
  });
  refresh();
}

// One in-flight session: what it has reported, and what it is waiting on.
function session(s) {
  const el = document.createElement("article");
  el.className = "session" + (s.pending ? " waiting" : "");

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = s.label;
  el.append(label);

  if (s.progress && s.progress.length) {
    const list = document.createElement("ul");
    list.className = "progress";
    // Newest last, and only the tail: this is a window on a running session,
    // not its log. The log is still the log.
    s.progress.slice(-6).forEach((n) => {
      const li = document.createElement("li");
      const at = document.createElement("span");
      at.className = "at";
      at.textContent = (n.at || "").split("T")[1] || "";
      li.append(at, document.createTextNode(n.note));
      list.append(li);
    });
    el.append(list);
  }

  if (s.pending) {
    const ask = document.createElement("div");
    ask.className = "ask";

    const q = document.createElement("div");
    q.className = "q";
    q.textContent = s.pending.question;
    ask.append(q);

    if (s.pending.context) {
      const ctx = document.createElement("div");
      ctx.className = "ctx";
      ctx.textContent = s.pending.context;
      ask.append(ctx);
    }

    if (s.pending.options && s.pending.options.length) {
      const choices = document.createElement("div");
      choices.className = "choices";
      s.pending.options.forEach((option) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = option;
        b.addEventListener("click", () => answer(s.pending.ticket, option));
        choices.append(b);
      });
      ask.append(choices);
    }

    // Free text as well as the options: a question with three buttons still
    // sometimes has a fourth answer.
    const form = document.createElement("form");
    const input = document.createElement("input");
    input.placeholder = "or answer in your own words";
    const send = document.createElement("button");
    send.type = "submit";
    send.textContent = "answer";
    form.append(input, send);
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      answer(s.pending.ticket, input.value.trim());
    });
    ask.append(form);
    el.append(ask);
  }
  return el;
}

function column(title, plans) {
  const el = document.createElement("section");
  el.className = "column";
  const h = document.createElement("h2");
  h.textContent = title + " ";
  const count = document.createElement("span");
  count.className = "count";
  count.textContent = plans.length;
  h.append(count);
  el.append(h);
  if (!plans.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "none";
    el.append(empty);
  }
  plans.forEach((p) => el.append(card(p)));
  return el;
}

async function refresh() {
  try {
    const [board, status] = await Promise.all([
      fetch("/api/board").then((r) => r.json()),
      fetch("/api/status").then((r) => r.json()),
    ]);

    asking = new Set((status.pending || []).map((p) => p.key));

    const main = $("board");
    main.replaceChildren();
    board.order.forEach((name) => main.append(column(name, board.columns[name] || [])));
    if (board.unplaced && board.unplaced.length) {
      main.append(column("no status", board.unplaced));
    }

    // Sessions get their own strip rather than living on the cards: a ritual
    // or the dispatch scan has no plan, and a question from one still has to
    // be answerable.
    const strip = $("sessions");
    strip.replaceChildren();
    const live = status.sessions || [];
    if (live.length) {
      const h = document.createElement("h2");
      h.textContent = "sessions " + live.length;
      strip.append(h);
      live.forEach((s) => strip.append(session(s)));
    }

    $("root").innerHTML = "";
    const root = document.createElement("code");
    root.textContent = status.root || "";
    $("root").append(root);

    const parts = [];
    parts.push(live.length ? live.length + " session(s) in flight" : "no sessions in flight");
    if (asking.size) parts.push(asking.size + " waiting on you");
    if (status.last_pass) parts.push("last pass " + status.last_pass);
    if (status.dry_run) parts.push("dry run");
    $("daemon").textContent = parts.join(" · ");

    // Holds are not listed here: status.held is whatever the last scan saw,
    // while every card carries its own hold computed fresh with the board.
    const notes = [];
    (status.unscheduled || []).forEach((r) => notes.push("never auto-fired: " + r));
    (status.warnings || []).forEach((w) => notes.push(w));
    $("notes").textContent = notes.join(" · ");
    $("notes").className = notes.length ? "problem" : "";
    $("clock").textContent = "refreshed " + new Date().toLocaleTimeString();
  } catch (e) {
    $("clock").textContent = "cannot reach the daemon — " + e;
  }
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
